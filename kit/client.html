<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrainMate (API)</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=Inter:wght@400;500;600&family=JetBrains+Mono&family=Noto+Sans+Bengali&family=Noto+Sans+Devanagari&display=swap" rel="stylesheet">
<style>
:root{--blue:#2563EB;--ink:#0F1B2D;--muted:#54657F;--line:#DBE6F4;--card:#fff;--amber:#C9820A;--amber-bg:#FBEFD6;--red:#DC2626}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans Bengali","Noto Sans Devanagari",sans-serif;color:var(--ink);background:linear-gradient(180deg,#E7F0FB,#F4F9FF);min-height:100vh}
.wrap{max-width:840px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.title{font-family:Space Grotesk;font-weight:600;font-size:18px}.title b{color:var(--blue)}
.title span{font-family:JetBrains Mono;font-size:10px;color:#8697B0;letter-spacing:1px;display:block;margin-top:2px;font-weight:400}
.lang{margin-left:auto;display:flex;align-items:center;gap:8px}
.lang label{font-size:12px;color:var(--muted)}
select{padding:8px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;cursor:pointer}
#thread{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:18px}
.msg{max-width:92%;line-height:1.6}
.msg.user{align-self:flex-end;background:linear-gradient(160deg,#2f6df0,#2153c9);color:#fff;padding:12px 16px;border-radius:14px 14px 4px 14px}
.msg.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);padding:14px 17px;border-radius:14px 14px 14px 4px;box-shadow:0 6px 18px -10px rgba(30,64,124,.25)}
.msg.bot h4{margin:12px 0 6px;color:var(--blue);text-transform:uppercase;font-size:12px;letter-spacing:.5px}
.msg.bot ul{margin:6px 0;padding-left:20px}.msg.bot li{margin:4px 0}
.msg.bot p{margin:8px 0}
.msg.bot code{font-family:JetBrains Mono;background:#EAF1FE;color:var(--blue);padding:1px 5px;border-radius:4px;font-size:12.5px}
.safety{display:flex;gap:9px;background:var(--amber-bg);border:1px solid #EFD49A;color:#8A5B00;padding:10px 12px;border-radius:10px;margin:9px 0}
.fig{margin:12px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fig img{display:block;width:100%;background:#0e1729}
.fig .cap{padding:8px 12px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line)}
.dim{color:var(--muted)}
.bar{display:flex;gap:8px;padding:14px 22px;border-top:1px solid var(--line);align-items:center}
input#q{flex:1;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;outline:none}
input#q:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.iconbtn{width:44px;height:44px;flex:none;border:1px solid var(--line);background:#fff;border-radius:12px;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{border-color:var(--blue);color:var(--blue)}
.iconbtn.rec{background:var(--red);border-color:var(--red);color:#fff;animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.5)}70%{box-shadow:0 0 0 8px rgba(220,38,38,0)}}
.iconbtn svg{width:20px;height:20px}
button.send{padding:0 18px;height:44px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:600;cursor:pointer}
button.send:disabled{background:#c9d7ea}
.hint{font-size:11px;color:#8697B0;padding:0 22px 12px}
</style></head><body>
<div class="wrap">
  <header>
    <div class="title">Train<b>Mate</b> · Posimat MASTER-15<span>API-backed</span></div>
    <div class="lang">
      <label id="langlabel">Language</label>
      <select id="lang">
        <option value="English">English</option>
        <option value="Bengali">বাংলা (Bengali)</option>
        <option value="Hindi">हिन्दी (Hindi)</option>
      </select>
    </div>
  </header>
  <div id="thread"><div class="msg bot dim" id="hint"></div></div>
  <div class="bar">
    <button class="iconbtn" id="mic" title="Speak your question">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3"/></svg>
    </button>
    <button class="iconbtn" id="upload" title="Upload a voice recording">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>
    </button>
    <input type="file" id="file" accept="audio/*" style="display:none">
    <input id="q" placeholder="">
    <button class="send" id="send">Ask</button>
  </div>
  <div class="hint" id="hint2"></div>
</div>
<script>
const API = "http://localhost:8010";                 // your backend URL
const el = id => document.getElementById(id);
const thread=el('thread'), q=el('q'), send=el('send'), mic=el('mic'), upBtn=el('upload'), file=el('file'), lang=el('lang');
const history = [];

// ---- UI strings per language ----
const STR = {
  English:{hint:"Ask me anything about the MASTER-15 — operation, alarms, changeover, maintenance or safety. You can type, speak (🎤), or upload a recording.",
    placeholder:"e.g. What is the Giramat bottle orientor?", ask:"Ask", reading:"Reading the manual…",
    langlabel:"Language", listening:"Listening… speak now", transcribing:"Transcribing your recording…",
    micNo:"Voice input isn't supported in this browser — try Chrome or Edge, or use the upload button.",
    backend:"Could not reach the backend at "+API+". Is it running?", hint2:"🎤 speak · ⬆ upload a voice file"},
  Bengali:{hint:"MASTER-15 সম্পর্কে যেকোনো প্রশ্ন করুন — পরিচালনা, অ্যালার্ম, চেঞ্জওভার, রক্ষণাবেক্ষণ বা নিরাপত্তা। টাইপ করুন, বলুন (🎤), অথবা রেকর্ডিং আপলোড করুন।",
    placeholder:"যেমন: Giramat bottle orientor কী?", ask:"জিজ্ঞাসা", reading:"ম্যানুয়াল পড়া হচ্ছে…",
    langlabel:"ভাষা", listening:"শুনছি… এখন বলুন", transcribing:"রেকর্ডিং লেখা হচ্ছে…",
    micNo:"এই ব্রাউজারে ভয়েস ইনপুট সমর্থিত নয় — Chrome বা Edge ব্যবহার করুন, অথবা আপলোড বোতাম ব্যবহার করুন।",
    backend:"ব্যাকএন্ড ("+API+") এ পৌঁছানো যায়নি। এটি কি চালু আছে?", hint2:"🎤 বলুন · ⬆ ভয়েস ফাইল আপলোড করুন"},
  Hindi:{hint:"MASTER-15 के बारे में कुछ भी पूछें — संचालन, अलार्म, चेंजओवर, रखरखाव या सुरक्षा। टाइप करें, बोलें (🎤), या रिकॉर्डिंग अपलोड करें।",
    placeholder:"जैसे: Giramat bottle orientor क्या है?", ask:"पूछें", reading:"मैनुअल पढ़ा जा रहा है…",
    langlabel:"भाषा", listening:"सुन रहा हूँ… अब बोलें", transcribing:"रिकॉर्डिंग लिखी जा रही है…",
    micNo:"इस ब्राउज़र में वॉइस इनपुट समर्थित नहीं है — Chrome या Edge आज़माएँ, या अपलोड बटन का उपयोग करें।",
    backend:"बैकएंड ("+API+") तक नहीं पहुँच सका। क्या यह चल रहा है?", hint2:"🎤 बोलें · ⬆ वॉइस फ़ाइल अपलोड करें"},
};
const RECLANG = {English:"en-IN", Bengali:"bn-IN", Hindi:"hi-IN"};
function T(){ return STR[lang.value] || STR.English; }
function applyStrings(){ const t=T(); el('hint').textContent=t.hint; q.placeholder=t.placeholder; send.textContent=t.ask;
  el('langlabel').textContent=t.langlabel; el('hint2').textContent=t.hint2; }
lang.addEventListener('change', ()=>{ applyStrings(); if(rec) rec.lang=RECLANG[lang.value]; });
applyStrings();

// ---- render helpers ----
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function fmt(t){ const lines=(t||"").split('\n'); let h='',ul=false; const cl=()=>{if(ul){h+='</ul>';ul=false;}};
  for(const raw of lines){const s=raw.trim(); if(!s){cl();continue;}
    let x=esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    if(/^⚠/.test(s)){cl();h+='<div class="safety">⚠<div>'+x.replace(/^⚠\s*/,'')+'</div></div>';continue;}
    if(/^#{1,3}\s+/.test(s)){cl();h+='<h4>'+x.replace(/^#{1,3}\s+/,'')+'</h4>';continue;}
    if(/^[-•]\s+/.test(s)){if(!ul){h+='<ul>';ul=true;}h+='<li>'+x.replace(/^[-•]\s+/,'')+'</li>';continue;}
    cl();h+='<p>'+x+'</p>';}
  cl();return h; }
function add(cls,html){const d=document.createElement('div');d.className='msg '+cls;d.innerHTML=html;thread.appendChild(d);thread.scrollTop=thread.scrollHeight;return d;}

// ---- ask ----
async function ask(){
  const text=q.value.trim(); if(!text) return;
  q.value=''; send.disabled=true;
  add('user',esc(text)); history.push({role:'user',content:text});
  const wait=add('bot dim',T().reading);
  try{
    const r=await fetch(API+'/ask',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question:text, history:history.slice(0,-1), language:lang.value})});
    const data=await r.json(); wait.remove();
    if(data.error){ add('bot','<span class="dim">Error: '+esc(data.error)+'</span>'); }
    else{ let html=fmt(data.answer||'(no answer)');
      for(const f of (data.figures||[])) html+='<div class="fig"><img src="'+API+f.url+'" alt=""><div class="cap"><b>'+esc(f.caption)+'</b> · p.'+f.page+'</div></div>';
      add('bot',html); history.push({role:'assistant',content:data.answer||''}); }
  }catch(e){ wait.remove(); add('bot','<span class="dim">'+esc(T().backend)+'</span>'); }
  send.disabled=false; q.focus();
}
send.onclick=ask; q.addEventListener('keydown',e=>{if(e.key==='Enter')ask();});

// ---- mic: browser speech-to-text (no backend) ----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec=null, recording=false;
if(SR){
  rec=new SR(); rec.lang=RECLANG[lang.value]; rec.interimResults=true; rec.continuous=false;
  rec.onresult=e=>{ let s=''; for(let i=0;i<e.results.length;i++) s+=e.results[i][0].transcript; q.value=s; };
  rec.onend=()=>{ recording=false; mic.classList.remove('rec'); mic.title="Speak your question"; };
  rec.onerror=()=>{ recording=false; mic.classList.remove('rec'); };
  mic.onclick=()=>{ if(recording){ rec.stop(); return; } rec.lang=RECLANG[lang.value]; q.value=''; q.placeholder=T().listening;
    try{ rec.start(); recording=true; mic.classList.add('rec'); }catch(_){} };
}else{
  mic.onclick=()=>{ add('bot','<span class="dim">'+esc(T().micNo)+'</span>'); };
}

// ---- upload a voice recording: backend transcription ----
upBtn.onclick=()=>file.click();
file.onchange=async()=>{
  if(!file.files.length) return;
  const f=file.files[0]; file.value='';
  const wait=add('bot dim',T().transcribing);
  const fd=new FormData(); fd.append('file',f); fd.append('language',lang.value);
  try{
    const r=await fetch(API+'/transcribe',{method:'POST',body:fd});
    const data=await r.json(); wait.remove();
    if(data.text){ q.value=data.text; q.focus(); }
    else{ add('bot','<span class="dim">'+esc(data.error||'Could not transcribe.')+'</span>'); }
  }catch(e){ wait.remove(); add('bot','<span class="dim">'+esc(T().backend)+'</span>'); }
};
</script>
</body></html>
